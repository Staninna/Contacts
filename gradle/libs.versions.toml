[versions]
#jetbrains
kotlin = "2.3.10"
#KSP
ksp = "2.3.12"
#Detekt
detekt = "1.23.8"
detektCompose = "0.4.28"
#AndroidX
androidx-swiperefreshlayout = "1.2.0"
#AutoFitTextView
autofittextview = "0.2.1"
#EzVCard
ezvcard = "0.12.2"
#IndicatorFastScroll
indicatorfastscroll = "4524cd0b61"
#Room
room = "2.8.5"
#Fossify
commons = "7.1.3"
#fork: Compose + Material 3 Expressive UI
forkComposeUi = "1.13.0"
forkMaterial3 = "1.5.0"
forkActivityCompose = "1.13.0"
forkLifecycle = "2.10.0"
forkIcons = "1.7.8"
forkShapes = "1.1.0"
forkJunit = "4.13.2"
forkRobolectric = "4.18.1"
#Gradle
gradlePlugins-agp = "9.5.1"
#build
app-build-compileSDKVersion = "37" #fork: Material 3 1.5 needs compileSdk 37
app-build-targetSDK = "36"
app-build-minimumSDK = "26"
app-build-javaVersion = "VERSION_17"
app-build-kotlinJVMTarget = "17"
[libraries]
#AndroidX
androidx-swiperefreshlayout = { module = "androidx.swiperefreshlayout:swiperefreshlayout", version.ref = "androidx-swiperefreshlayout" }
#AutoFitTextView
autofittextview = { module = "me.grantland:autofittextview", version.ref = "autofittextview" }
#EzVcard
ezvcard = { module = "com.googlecode.ez-vcard:ez-vcard", version.ref = "ezvcard" }
#IndicatorFastScroll
indicatorfastscroll = { module = "org.fossify:IndicatorFastScroll", version.ref = "indicatorfastscroll" }
#Room
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
#Compose
compose-detekt = { module = "io.nlopez.compose.rules:detekt", version.ref = "detektCompose" }
#Fossify
fossify-commons = { module = "org.fossify:commons", version.ref = "commons" }
#fork: Compose + Material 3 Expressive UI
fork-compose-ui = { module = "androidx.compose.ui:ui", version.ref = "forkComposeUi" }
fork-compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "forkComposeUi" }
fork-compose-animation = { module = "androidx.compose.animation:animation", version.ref = "forkComposeUi" }
fork-compose-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "forkComposeUi" }
fork-compose-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "forkComposeUi" }
fork-compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "forkMaterial3" }
fork-compose-icons = { module = "androidx.compose.material:material-icons-extended", version.ref = "forkIcons" }
fork-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "forkActivityCompose" }
fork-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "forkLifecycle" }
fork-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "forkLifecycle" }
fork-graphics-shapes = { module = "androidx.graphics:graphics-shapes", version.ref = "forkShapes" }
fork-junit = { module = "junit:junit", version.ref = "forkJunit" }
fork-robolectric = { module = "org.robolectric:robolectric", version.ref = "forkRobolectric" }
fork-compose-ui-test = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "forkComposeUi" }
fork-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "forkComposeUi" }
[bundles]
room = [
    "androidx-room-ktx",
    "androidx-room-runtime",
]
[plugins]
android = { id = "com.android.application", version.ref = "gradlePlugins-agp" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
fork-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" } #fork: Compose compiler
